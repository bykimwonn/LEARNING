{% extends "base.html" %}
{% block title %}Set your password · BT LEARNING{% endblock %}
{% block content %}
<div style="max-width:440px;margin:50px auto">
  <div class="card">
    <h1 style="font-size:22px">🔐 Create your private password</h1>
    <p class="muted small">Welcome, {{ current_user.name }}! Since this is your first
       entry, please set a password only you will know.</p>
    <form method="post">
      <label>New password</label>
      <input type="password" name="p1" placeholder="At least 4 characters" required>
      <label>Confirm password</label>
      <input type="password" name="p2" placeholder="Repeat your password" required>
      <div style="margin-top:18px"><button class="btn" style="width:100%">Save password</button></div>
    </form>
  </div>
</div>
{% endblock %}
