{% extends "base.html" %}
{% block title %}Independent Login · BT LEARNING{% endblock %}
{% block content %}
<div style="max-width:440px;margin:40px auto">
  <div class="card">
    <h1 style="font-size:22px">🎒 Independent Learner Login</h1>
    <p class="muted small">Log in with the email and password you registered with.</p>
    <form method="post">
      <label>Email</label>
      <input type="email" name="email" placeholder="you@example.com" required>
      <label>Password</label>
      <input type="password" name="password" placeholder="Your password" required>
      <div style="margin-top:18px"><button class="btn" style="width:100%">Log in</button></div>
    </form>
    <div style="margin-top:16px" class="muted small">
      Demo: <b>chipo@gmail.com</b> / <b>chipo123</b>.
      <a href="{{ url_for('register') }}">Create an account</a>
    </div>
  </div>
  <div class="center"><a href="{{ url_for('choose') }}">← Back</a></div>
</div>
{% endblock %}
